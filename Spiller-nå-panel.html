<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<title>Retro Digital Display — Spiller Nå (CRT‑off/on)</title>
<style>
  :root{
    --bg:#E9E3D2;
    --display-bg:#1E1E1E;
    --digit:#00FF9F;
    --warm:#E17858;
  }
  html,body{height:100%;margin:0;background:var(--bg);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;color:var(--digit)}

  .display{
    width:520px;height:180px;border-radius:18px;background:var(--display-bg);position:relative;overflow:hidden;
    box-shadow:inset 0 0 15px rgba(0,0,0,0.8),0 10px 25px rgba(0,0,0,0.25),0 0 20px rgba(0,255,159,0.3);
    border:1px solid rgba(255,255,255,0.1);
    animation:panelPulse 6s ease-in-out infinite;
  }

  /* CRT on/off effect */
  .tube{ position:absolute; inset:0; display:block; }
  .display.crt-off .tube{ animation: crtOff 900ms ease-in forwards; }
  .display.crt-on  .tube{ animation: crtOn  900ms ease-out both; }

  @keyframes crtOff {
    0%   { transform: scaleX(1) scaleY(1);   opacity:1; }
    60%  { transform: scaleX(1) scaleY(0.02); opacity:1; }
    100% { transform: scaleX(0) scaleY(0.02); opacity:0; }
  }
  @keyframes crtOn {
    0%   { transform: scaleX(0) scaleY(0.02); opacity:0; }
    40%  { transform: scaleX(1) scaleY(0.02); opacity:1; }
    100% { transform: scaleX(1) scaleY(1);    opacity:1; }
  }

  /* Horizontal line + center dot flash during OFF */
  .display.crt-off::before,
  .display.crt-off::after{ content:""; position:absolute; left:50%; top:50%; pointer-events:none; }
  .display.crt-off::before{ /* horizontal line */
    translate:-50% -50%; width:100%; height:2px;
    background: linear-gradient(90deg, transparent, rgba(255,183,77,0.9), transparent);
    filter: drop-shadow(0 0 6px rgba(255,183,77,0.75)); opacity:0; animation: lineFlash 900ms ease-in forwards;
  }
  .display.crt-off::after{ /* center dot */
    translate:-50% -50%; width:8px; height:8px; border-radius:50%; background:#FFD166;
    box-shadow:0 0 10px rgba(255,183,77,0.9), 0 0 24px rgba(255,183,77,0.6); opacity:0; animation: dotFlash 900ms ease-in forwards;
  }
  @keyframes lineFlash{ 0%{opacity:0;} 40%{opacity:1;} 100%{opacity:0;} }
  @keyframes dotFlash{ 0%,70%{opacity:0;} 85%{opacity:1;} 100%{opacity:0;} }

  @keyframes panelPulse {
    0%{box-shadow:inset 0 0 15px rgba(0,0,0,0.8),0 10px 25px rgba(0,0,0,0.25),0 0 20px rgba(0,255,159,0.3);} 
    50%{box-shadow:inset 0 0 20px rgba(255,183,77,0.3),0 10px 25px rgba(0,0,0,0.25),0 0 35px rgba(255,183,77,0.4);} 
    100%{box-shadow:inset 0 0 15px rgba(0,0,0,0.8),0 10px 25px rgba(0,0,0,0.25),0 0 20px rgba(0,255,159,0.3);} }

  /* Warm glass sweep */
  .display .glass{ content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,rgba(255,183,77,0.25) 0%,transparent 50%,rgba(255,183,77,0.15) 100%); mix-blend-mode:screen; opacity:.45; background-size:200% 100%; animation: glassSweep 14s linear infinite; }
  @keyframes glassSweep{ 0%{background-position:-200% 0;opacity:.2;} 50%{background-position:100% 0;opacity:.7;} 100%{background-position:200% 0;opacity:.2;} }

  .content{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; text-shadow:0 0 8px rgba(255,183,77,0.6); }
  .header{ font-size:.9rem; color:var(--warm); letter-spacing:.15em; text-transform:uppercase; animation:colorPulse 6s ease-in-out infinite; }
  .track{ font-size:1.5rem; animation:colorPulse 6s ease-in-out infinite; }
  .artist{ font-size:1rem; opacity:.7; animation:colorPulse 6s ease-in-out infinite; }

  @keyframes colorPulse{ 0%{opacity:.8;color:#FFD166;text-shadow:0 0 10px rgba(255,183,77,.5);} 25%{color:#FFE29A;text-shadow:0 0 12px rgba(255,226,154,.6);} 50%{opacity:1;color:#FFBE5B;text-shadow:0 0 14px rgba(255,190,91,.8);} 75%{color:#FFE29A;text-shadow:0 0 12px rgba(255,226,154,.6);} 100%{opacity:.8;color:#FFD166;text-shadow:0 0 10px rgba(255,183,77,.5);} }

  .visualizer{ position:absolute; bottom:10px; left:0; right:0; height:20px; display:flex; justify-content:center; align-items:end; gap:4px; }
  .bar{ width:6px; border-radius:3px; background:#FFD166; animation:equalize 1s ease-in-out infinite; box-shadow:0 0 8px rgba(255,183,77,0.6); }
  .bar:nth-child(2){animation-delay:.1s} .bar:nth-child(3){animation-delay:.2s} .bar:nth-child(4){animation-delay:.3s} .bar:nth-child(5){animation-delay:.4s}
  @keyframes equalize{ 0%,100%{height:5px;opacity:.6} 50%{height:20px;opacity:1} }
</style>
</head>
<body>
  <div class="display" id="panel">
    <div class="tube">
      <div class="glass"></div>
      <div class="content">
        <div class="header">Spiller Nå</div>
        <div class="track">Hold Fast</div>
        <div class="artist">Samuel Høysæter</div>
      </div>
      <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>

  <script>
  // Demo: slå av (CRT) og på igjen
  const panel = document.getElementById('panel');
  setTimeout(()=>{ panel.classList.add('crt-off'); }, 5000);      // OFF
  setTimeout(()=>{ panel.classList.remove('crt-off'); panel.classList.add('crt-on'); }, 6500); // ON
  setTimeout(()=>{ panel.classList.remove('crt-on'); }, 7500);    // stabiliser
</script>
</body>
</html>
